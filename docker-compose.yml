services:
  backend:
    build:
      context: ./backend
    container_name: bbb_backend
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: bbb_voting_development
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: bbb_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bbb_voting_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bbb_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
