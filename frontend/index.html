<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BBB Voting Challenge</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <header class="text-center mb-5">
        <h1 class="display-5 fw-bold">BBB Voting Challenge</h1>
        <p class="text-secondary">
          Vote no participante que deseja eliminar do programa.
        </p>
      </header>

      <section id="votingScreen">
        <div id="participants" class="row g-4 mb-4"></div>

        <div class="text-center">
          <button id="voteButton" class="btn btn-secondary px-5">Votar</button>
        </div>
      </section>

      <section id="resultScreen" class="d-none">
        <div class="alert alert-success shadow-sm">
          <h5 class="mb-1">✅ Voto computado com sucesso!</h5>
          <small>Obrigado pela participação.</small>
        </div>

        <div class="card shadow-sm mb-4">
          <div class="card-header fw-semibold">Resultado parcial</div>

          <div class="card-body">
            <p class="mb-4">
              <strong id="totalVotes">Total de votos: 0</strong>
            </p>

            <div id="results"></div>
          </div>
        </div>

        <div class="card shadow-sm mb-4">
          <div class="card-header fw-semibold">Votos por hora</div>

          <div class="card-body">
            <div id="hourlyResults"></div>
          </div>
        </div>

        <div class="text-center">
          <button id="voteAgainButton" class="btn btn-outline-primary">
            Voltar para votação
          </button>
        </div>
      </section>
    </div>

    <input
      id="website"
      class="d-none"
      type="text"
      autocomplete="off"
      tabindex="-1"
    />

    <script src="./js/api.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/results.js"></script>
    <script src="./js/vote.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
